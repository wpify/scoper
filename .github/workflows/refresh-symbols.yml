name: Refresh symbols

# The value of this package is an up-to-date database of the symbols that must stay global. Until
# now that database was refreshed whenever somebody remembered, so a WordPress or WooCommerce
# release shipped broken scoping to every consumer until it was noticed.

on:
  schedule:
    # Mondays 04:00 UTC. WordPress and WooCommerce both release on a Tuesday cadence, so this
    # picks up last week's release with a working week left to review it.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate the symbol lists
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Snapshot the current counts
        run: |
          composer install --no-interaction --no-progress
          php scripts/symbol-guard.php snapshot "${RUNNER_TEMP}/symbol-counts.json"

      - name: Pull the latest WordPress, WooCommerce, Action Scheduler and WP-CLI
        run: composer update --no-interaction --no-progress

      - name: Record the source versions
        id: versions
        run: |
          {
            echo 'summary<<SUMMARY'
            composer show --direct --format=json \
              | php -r '$d=json_decode(stream_get_contents(STDIN),true)["installed"]??[];foreach($d as $p){printf("- %s %s\n",$p["name"],$p["version"]);}'
            echo SUMMARY
          } >> "$GITHUB_OUTPUT"

      # Non-zero on a parse failure, which is how a truncated list gets produced in the first place.
      - name: Regenerate
        run: composer extract

      - name: Refuse a silent drop in symbol counts
        run: php scripts/symbol-guard.php compare "${RUNNER_TEMP}/symbol-counts.json" 1.0

      - name: The suites still pass against the new lists
        run: |
          vendor/bin/phpunit --testsuite=unit
          vendor/bin/phpunit --testsuite=integration

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-symbols
          title: 'chore: refresh the WordPress and WooCommerce symbol lists'
          commit-message: 'chore: refresh symbol lists'
          labels: symbols
          delete-branch: true
          body: |
            Regenerated by the scheduled `Refresh symbols` workflow.

            Source packages:

            ${{ steps.versions.outputs.summary }}

            The symbol counts were checked against the previous lists: a drop of more than 1% in
            any category fails the job rather than opening this pull request, because a truncated
            list silently scopes symbols that have to stay global.

            `symbols/*.php` is marked `linguist-generated`, so GitHub collapses the diff. Review
            the counts in the job log rather than the file contents.
